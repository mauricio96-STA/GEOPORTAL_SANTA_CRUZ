<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geoportal - Santa Cruz</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <link rel="stylesheet" href="styles.css"/>
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="header-logo">
            <i class="fas fa-map-marked-alt"></i>
        </div>
        <h1 class="header-title">Geoportal Santa Cruz</h1>
        <div class="header-divider"></div>
        <span class="header-subtitle">Cantón Santa Cruz · Bolívar · Ecuador</span>
    </header>

    <!-- Main Content -->
    <div class="main">

        <!-- Panel Lateral -->
        <aside class="side-panel" id="side_panel">
            <div class="panel-content">
                <div class="panel-header">
                    <i class="fas fa-layer-group"></i> Capas
                </div>
                <div class="panel-layers" id="layers_list"></div>
                <div class="panel-section">
                    <div class="panel-section-title"><i class="fas fa-map"></i> Mapa Base</div>
                    <div class="basemap-row">
                        <button class="basemap-pill active" data-type="osm" onclick="switchBasemap('osm')">
                            <i class="fas fa-map"></i> Calles
                        </button>
                        <button class="basemap-pill" data-type="satellite" onclick="switchBasemap('satellite')">
                            <i class="fas fa-satellite"></i> Satélite
                        </button>
                    </div>
                </div>
                <div class="panel-status">
                    <i class="fas fa-database"></i>
                    <span class="count" id="total_features">0</span> features
                </div>
            </div>
            <div class="panel-toggle-btn" onclick="togglePanel()">
                <i class="fas fa-chevron-left"></i>
            </div>
        </aside>

        <!-- Map -->
        <div class="map-container">
            <div id="map"></div>

            <!-- Botón Flotante Reportar -->
            <button class="report-fab" id="report_fab" onclick="abrirModalReporte()" title="Reportar un problema">
                <i class="fas fa-exclamation-triangle"></i>
                <span>Reportar</span>
            </button>

            <!-- Legend -->
            <div class="legend-panel" id="legend_box">
                <div class="legend-header" onclick="toggleLegend()">
                    <i class="fas fa-palette"></i> Leyenda
                </div>
                <div class="legend-body" id="legend_body"></div>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loading">
        <div class="spinner"></div>
        <p>Geoportal Santa Cruz</p>
        <div class="detail" id="loading_detail">Conectando con Supabase...</div>
        <div class="progress-bar">
            <div class="progress-fill" id="progress_fill"></div>
        </div>
    </div>

    <!-- Modal Reporte Ciudadano -->
    <div class="modal-overlay" id="modal_reporte">
        <div class="modal-card">
            <div class="modal-header">
                <div class="modal-header-left">
                    <i class="fas fa-exclamation-triangle"></i>
                    <span>Reportar Problema</span>
                </div>
                <button class="modal-close" onclick="cerrarModalReporte()">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <div class="modal-body">
                <!-- Tipo de Problema -->
                <div class="form-group-modal">
                    <label><i class="fas fa-tag"></i> Tipo de Problema *</label>
                    <div id="problemas_grid" class="problemas-grid"></div>
                    <input type="hidden" id="rpt_tipo" required>
                </div>

                <!-- Descripción -->
                <div class="form-group-modal">
                    <label for="rpt_descripcion"><i class="fas fa-comment-alt"></i> Descripción *</label>
                    <textarea id="rpt_descripcion" rows="3"
                        placeholder="Describe el problema con el mayor detalle posible..."
                        required></textarea>
                </div>

                <!-- Datos -->
                <div class="form-group-modal">
                    <label><i class="fas fa-user"></i> Datos de Contacto (Opcional)</label>
                    <div class="form-row-modal">
                        <input type="text" id="rpt_autor" placeholder="Nombre">
                        <input type="tel" id="rpt_telefono" placeholder="Teléfono">
                    </div>
                </div>

                <!-- Ubicación -->
                <div class="form-group-modal">
                    <label><i class="fas fa-map-marker-alt"></i> Ubicación *</label>
                    <p class="form-hint-modal">
                        <i class="fas fa-info-circle"></i>
                        Se detecta automáticamente. También puedes clic en el mapa para ajustar.
                    </p>
                    <div class="coord-row-modal">
                        <div class="coord-field">
                            <label>Latitud</label>
                            <input type="text" id="rpt_lat_display" readonly placeholder="---">
                            <input type="hidden" id="rpt_lat" required>
                        </div>
                        <div class="coord-field">
                            <label>Longitud</label>
                            <input type="text" id="rpt_lng_display" readonly placeholder="---">
                            <input type="hidden" id="rpt_lng" required>
                        </div>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <button class="btn-modal-cancel" onclick="cerrarModalReporte()">Cancelar</button>
                <button class="btn-modal-submit" id="rpt_btnEnviar" onclick="enviarReporte()" disabled>
                    <i class="fas fa-paper-plane"></i> Enviar Reporte
                </button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toast_msg">Reporte enviado correctamente</span>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>

</body>
</html>
